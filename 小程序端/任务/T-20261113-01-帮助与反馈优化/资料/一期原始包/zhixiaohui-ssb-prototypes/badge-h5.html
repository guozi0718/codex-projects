<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智小徽电子校徽</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<style>
:root{
  /* 「晴空校园」天蓝配色：与家长端同源 */
  --navy:#2E7CF0; --navy-deep:#1D63D8;
  --gold2:#E8A93D;
  --ink:#233047; --ink-2:#5C6A80; --ink-3:#9AA7BB;
  --bg:#F0F5FB; --line:#E2EAF4;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:linear-gradient(150deg,#DCEBFB 0%,#FDF3E4 100%);display:flex;justify-content:center;align-items:center;height:100vh;padding:0;overflow:hidden;color:var(--ink)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ===== 手机壳（与家长端同款；演示说明内开关可隐藏） ===== */
.phone{width:390px;height:844px;background:var(--bg);border-radius:44px;box-shadow:0 24px 80px rgba(0,0,0,.5),0 0 0 10px #0D1420,0 0 0 12px #2A3548;overflow:hidden;position:relative;display:flex;flex-direction:column}
body.no-shell .phone{border-radius:0;box-shadow:none}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}

/* 状态栏：时间 + 信号/Wi-Fi/电池，悬浮于蓝天头部之上（图标与家长端 parent.js 注入的同套 SVG） */
.statusbar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:14px;font-weight:600;color:#fff;z-index:5}
.statusbar .right{display:flex;align-items:center;gap:6px}

/* ===== 页面头部：品牌识别区（蓝天背景，渐变兜底防图片缺失） ===== */
.hero{background:linear-gradient(168deg,#6ABAFF 0%,#3D8BFC 60%,#1D63E8 100%);background:url(assets/sky-clouds.jpg) center top/cover no-repeat,linear-gradient(168deg,#6ABAFF 0%,#3D8BFC 60%,#1D63E8 100%);padding:70px 26px 58px;text-align:center;color:#fff}
.hero .logo{width:78px;height:78px;border-radius:20px;background:#fff;box-shadow:0 8px 22px rgba(29,99,216,.32);display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px}
.hero .logo img{width:50px;height:auto;display:block}
.hero h1{font-size:23px;letter-spacing:2px;text-shadow:0 1px 6px rgba(29,99,216,.3)}
.hero .sub{font-size:14px;color:rgba(255,255,255,.95);margin-top:9px;letter-spacing:.5px;text-shadow:0 1px 6px rgba(29,99,216,.3)}

/* ===== 内容卡片 ===== */
.bd{padding:0 18px 26px;margin-top:-30px;position:relative}
.card{background:#fff;border-radius:16px;padding:22px 20px;box-shadow:0 4px 18px rgba(46,124,240,.1);border:1px solid var(--line)}
.card + .card{margin-top:14px}
.card h2{font-size:16.5px;display:flex;align-items:center;gap:8px}
.card h2 svg{flex-shrink:0}
.card .desc{font-size:13px;color:var(--ink-2);line-height:1.75;margin-top:8px}

/* 微信外：扫一扫三步引导 */
.steps{margin-top:16px}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.step + .step{border-top:1px dashed #EFF4FA}
.step .no{width:22px;height:22px;border-radius:50%;background:linear-gradient(150deg,#6ABAFF,#1D63D8);color:#fff;font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.step .tx{font-size:13.5px;line-height:1.65;color:var(--ink)}

/* 微信内：一键打开按钮（真实环境为 wx-open-launch-weapp 开放标签，UA 命中微信时才渲染；按钮用微信品牌绿） */
.wx-open-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:16px;padding:14px 0;border:none;border-radius:12px;background:#07C160;color:#fff;font-size:16px;font-weight:600;letter-spacing:1px;cursor:pointer;box-shadow:0 6px 16px rgba(7,193,96,.3);transition:.15s}
.wx-open-btn:active{transform:scale(.98)}

/* 拾到校徽 */
.found .call{display:flex;align-items:center;gap:8px;margin-top:12px;padding:11px 14px;background:#F5F9FE;border:1px solid var(--line);border-radius:11px;font-size:13.5px;color:var(--ink);cursor:pointer}
.found .call b{color:var(--navy-deep);letter-spacing:.5px}
.found .call .arr{margin-left:auto;color:var(--ink-3)}

/* 页脚 */
.foot{text-align:center;font-size:11px;color:var(--ink-3);line-height:1.9;padding:20px 0 8px}

/* ===== 演示说明（灵动岛位置浮动 chip，原型工具，非页面内容；样式与家长端同款） ===== */
.demo-fab{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:300}
.demo-chip{display:flex;align-items:center;gap:7px;background:rgba(15,23,35,.72);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:18px;padding:7px 13px;font-size:12.5px;font-weight:600;backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.demo-chip .x{display:inline-flex;width:16px;height:16px;border-radius:50%;align-items:center;justify-content:center;font-size:10px;border:1px solid rgba(255,255,255,.45)}
.demo-pop{display:none;position:absolute;top:42px;left:50%;margin-left:-134px;width:268px;background:#fff;border:1px solid #E2EAF4;border-radius:14px;padding:14px 15px;box-shadow:0 14px 40px rgba(29,99,216,.18);max-height:calc(844px - 42px - 10px - 24px);overflow-y:auto;overscroll-behavior:contain}
.demo-pop.show{display:block;animation:fadein .18s ease}
@keyframes fadein{from{opacity:0;transform:translateY(-5px)}to{opacity:1}}
.demo-pop .dt{font-size:12.5px;color:var(--navy);font-weight:600;margin-bottom:4px}
.demo-pop .dd{font-size:11.5px;color:#5C6A80;line-height:1.65;margin-bottom:10px}
.demo-pop button{display:block;width:100%;text-align:left;font-size:12px;color:#33415E;padding:8px 10px;border:1px solid #E2EAF4;border-radius:9px;margin-bottom:7px;background:#F5F9FE}
.demo-pop button:hover{border-color:var(--navy);color:var(--navy)}
.demo-pop .sw-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#33415E;padding:8px 10px;border:1px solid #E2EAF4;border-radius:9px;margin-bottom:7px;background:#F5F9FE;cursor:pointer;user-select:none;gap:8px}
.demo-pop .sw{position:relative;width:34px;height:19px;border-radius:10px;background:#C6CCD6;transition:background .18s;flex-shrink:0}
.demo-pop .sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:left .18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.demo-pop .sw.on{background:var(--navy)}
.demo-pop .sw.on::after{left:17px}

/* toast */
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:rgba(35,48,71,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:22px;opacity:0;visibility:hidden;transition:.25s;z-index:99;max-width:320px;text-align:center;white-space:nowrap}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

      <div class="foot">阳光智园科技有限公司 · 京ICP备20260123号-2</div>

    </div>
  </div>

  <!-- 状态栏（悬浮于蓝天头部之上） -->

  </div>
</div>

<script>
/* ---------- 演示说明 ---------- */
var wxEnv=false; // false=微信外（默认），true=微信内 WebView
const demoInfo={
 t:'校徽二维码 H5 兜底页',
 d:'校徽壳印二维码为普通链接二维码：微信内扫码/长按识别直接打开智小徽小程序（家长→校徽核对视图、教师→学生信息视图，由小程序按登录身份分流）；微信外扫码（系统相机/其他 App）落到本页。本页为完全公开、不鉴权、零学生信息的纯静态导流页，不以任何参数查询后端（防批量枚举、恒可用），三类访客：家长/教师微信外扫码→引导回微信；微信 WebView 内点开链接→展示 wx-open-launch-weapp 一键打开按钮（真实环境按 UA 检测渲染，依赖已认证服务号 + JS-SDK，原型用下方开关模拟）；陌生人拾到校徽→归还引导，不泄露失主信息。线上拾获上报通道为后续阶段。对应设计文档 7.5 节。'
};
function renderDemo(){
  document.getElementById('demo-pop').innerHTML='<div class="dt">📋 '+demoInfo.t+'</div><div class="dd">'+demoInfo.d+'</div>'+
    /* 与各端演示说明统一的原型总览入口（新开标签页，不打断当前演示状态） */
    '<button onclick="closeDemo();window.open(\'index.html\')">原型总览 →</button>'+
    '<div class="sw-row" onclick="toggleEnv()">模拟「微信内打开」状态<span class="sw'+(wxEnv?' on':'')+'"></span></div>'+
    '<div class="sw-row" onclick="toggleShell()">显示手机壳<span class="sw'+(shellOn()?' on':'')+'"></span></div>';
}
function toggleDemo(){renderDemo();const p=document.getElementById('demo-pop');p.scrollTop=0;p.classList.toggle('show')}
function closeDemo(){document.getElementById('demo-pop').classList.remove('show')}
/* 演示说明展开时，点击弹层（含 chip）以外区域收起；捕获阶段监听，不受页面元素 stopPropagation 影响 */
document.addEventListener('click',e=>{
  const p=document.getElementById('demo-pop');
  if(p.classList.contains('show')&&!e.target.closest('#demo-fab'))p.classList.remove('show');
},true);

/* 微信内 / 微信外 状态切换（真实环境由 UA 检测决定，原型手动模拟） */
function toggleEnv(){
  wxEnv=!wxEnv;
  document.getElementById('card-out').style.display=wxEnv?'none':'';
  document.getElementById('card-in').style.display=wxEnv?'':'none';
  renderDemo();
  toast(wxEnv?'已切换：微信内打开状态':'已切换：微信外扫码状态');
}

/* -------- 手机壳视口自适应：居中并按需等比缩放（与家长端同逻辑） -------- */
function fitPhone(){
  /* 外壳描边（box-shadow 外扩 12px）计入尺寸，受限方向至少留 16px 空白便于截图；隐藏手机壳时无外扩 */
  const pad=document.body.classList.contains('no-shell')?0:24;
  const s=Math.min(1,(innerHeight-32)/(844+pad),(innerWidth-32)/(390+pad));
  /* 用 zoom 而非 transform:scale——原生 select 弹层按布局坐标定位，transform 会导致错位 */
  document.querySelector('.phone').style.zoom=s;
}
/* -------- 手机壳显隐：演示说明内开关，localStorage 记忆并与家长端/教师端共享 -------- */
function shellOn(){return localStorage.getItem('proto-shell')!=='off'}
function toggleShell(){
  localStorage.setItem('proto-shell',shellOn()?'off':'on');
  applyShell();renderDemo();
}
function applyShell(){
  document.body.classList.toggle('no-shell',!shellOn());
  fitPhone();
}
addEventListener('resize',fitPhone);applyShell();

/* toast */
var toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}
</script>
